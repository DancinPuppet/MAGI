[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-source-localization"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "faiss-cpu==1.8.0",
  "networkx==3.4.2",
  "numpy==1.26.4",
  "scikit-learn==1.7.2",
  "scipy==1.14.1",
  "torch==2.5.1",
]

[tool.setuptools.packages.find]
where = ["src"]
